<VirtualHost *:80>
    ServerName crm3.antmall.mn
    DocumentRoot /srv/antmall-crm/public-crm3
    <Directory /srv/antmall-crm/public-crm3>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://crm3.antmall.mn%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName crm3.antmall.mn
    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/crm3.antmall.mn/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/crm3.antmall.mn/privkey.pem
    IncludeOptional /etc/letsencrypt/options-ssl-apache.conf
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    Header always set Strict-Transport-Security "max-age=31536000"
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader unset X-Forwarded-Host
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyTimeout 90
    LimitRequestBody 12582912
    ProxyPass / http://127.0.0.1:3002/ connectiontimeout=5 timeout=90
    ProxyPassReverse / http://127.0.0.1:3002/
    ErrorLog ${APACHE_LOG_DIR}/antmall-crm3-error.log
    CustomLog ${APACHE_LOG_DIR}/antmall-crm3-access.log combined
</VirtualHost>
