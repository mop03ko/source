<VirtualHost *:80>
 ServerName crm3.antmall.mn
 DocumentRoot /srv/antmall-crm/public-crm3
 <Directory /srv/antmall-crm/public-crm3>
  Options None
  AllowOverride None
  Require all granted
 </Directory>
 RewriteEngine On
 RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
 RewriteRule ^ https://crm.antmall.mn%{REQUEST_URI} [R=302,L,NE]
</VirtualHost>
<VirtualHost *:443>
 ServerName crm3.antmall.mn
 SSLEngine On
 SSLCertificateFile /etc/letsencrypt/live/crm3.antmall.mn/fullchain.pem
 SSLCertificateKeyFile /etc/letsencrypt/live/crm3.antmall.mn/privkey.pem
 IncludeOptional /etc/letsencrypt/options-ssl-apache.conf
 SSLProtocol -all +TLSv1.2 +TLSv1.3
 Redirect 302 / https://crm.antmall.mn/
</VirtualHost>
